name: Job Radar

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan job boards
        run: python monitor.py
      - name: Save results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Radar update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
      - name: Alert on new high-fit roles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/alert.md ]; then
            printf '%s\n\ncc @%s\n' "$(cat data/alert.md)" "${{ github.repository_owner }}" > /tmp/body.md
            gh issue create --title "New roles · $(TZ=America/Chicago date +'%b %-d, %-I:%M %p') CT" --body-file /tmp/body.md
          fi
